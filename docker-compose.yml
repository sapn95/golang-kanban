services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kanban"]
      interval: 5s
      timeout: 3s
      retries: 10
  kanban:
    build: .
    environment:
      STORAGE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: user
      DB_PASS: password
      DB_NAME: kanban
    ports:
      - "17808:17808"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
