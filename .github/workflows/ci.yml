name: ci

on:
  pull_request:
  push:
    branches: [homelab]
  schedule:
    # Weekly, so a new Go release or a moved dependency is caught without commits.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and `pull_request` runs code from strangers.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of the version, so there is no second
          # pin here to drift away from it.
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
        env:
          # shellcheck's info and style notes are advisory here; a warning or
          # worse blocks.
          SHELLCHECK_OPTS: --severity=warning

  css:
    name: css
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: compile tailwind
        # The script pins the compiler's version and checks the digest of the
        # binary it downloads; see docs/adr/0011.
        run: sh assets/tailwind.sh
      - name: the committed stylesheet is what the sources compile to
        run: |
          if ! git diff --exit-code -- assets/tailwind.css; then
            echo "::error::assets/tailwind.css is stale. Run 'go generate ./assets/' and commit the result."
            exit 1
          fi
          echo "assets/tailwind.css matches the classes the templates use"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The Postgres store is tested against a real Postgres, not a mock. The
      # database is named kanban_test because the suite refuses to drop tables
      # in a database whose name does not end in _test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        env:
          KANBAN_TEST_POSTGRES_URL: postgres://kanban:kanban@localhost:5432/kanban_test?sslmode=disable
        run: go test ./... -race -coverpkg=./... -coverprofile=coverage.out
      - name: coverage gate
        env:
          MINIMUM: "80"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')"
          echo "total coverage: ${total}%  (minimum ${MINIMUM}%)"
          echo "### coverage ${total}% (minimum ${MINIMUM}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MINIMUM" 'BEGIN { exit (t + 0 < m + 0) }'
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/kanban

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install helm
        env:
          # Helm is a single Go binary. Fetching it directly keeps the
          # deprecated Node 20 runtime of azure/setup-helm out of this
          # workflow, and pins the version where it can be read.
          HELM_VERSION: "v4.2.4"
        run: |
          set -euo pipefail
          tgz="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${tgz}" -o "$tgz"
          curl -fsSL "https://get.helm.sh/${tgz}.sha256sum" -o sums
          # An unverified binary that then renders manifests for a cluster is
          # not worth the two lines this saves.
          sha256sum -c sums
          tar xzf "$tgz" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf "$tgz" sums linux-amd64
          helm version --short
      - name: helm lint
        run: helm lint deploy/helm/kanban
      - name: every values combination the chart claims to support
        run: |
          set -euo pipefail
          ok() {
            if ! helm template t deploy/helm/kanban "$@" >/dev/null 2>&1; then
              echo "::error::should render but does not: $*"
              exit 1
            fi
          }
          nope() {
            if helm template t deploy/helm/kanban "$@" >/dev/null 2>&1; then
              echo "::error::should be rejected but renders: $*"
              exit 1
            fi
          }
          ok
          ok --set storage=memory --set postgres.enabled=false
          ok --set storage=postgres --set postgres.enabled=false --set externalDatabase.url=postgres://u:p@h:5432/d
          ok --set ingress.enabled=true
          ok --set service.type=NodePort --set service.nodePort=30808
          # A release installed before the auth section existed carries no
          # .Values.auth at all; --reuse-values then hands the templates nil.
          ok --set auth=null
          ok --set networkPolicy.enabled=true
          ok --set postgres.existingSecret=kanban-db
          ok --set storage=sqlite --set postgres.enabled=false
          # Sign-in, configured the way the failures below say it has to be.
          auth=(--set auth.enabled=true
                --set auth.redirectURL=https://board.example.com/oauth2/callback
                --set auth.clientID=id --set auth.clientSecret=secret
                --set auth.cookie.secure=false)
          ok "${auth[@]}"
          # The sidecar establishes who the caller is; the app has to be told to
          # read it, or the board is anonymous behind a sign-in.
          rendered="$(helm template t deploy/helm/kanban "${auth[@]}")"
          for expected in "name: AUTH_MODE" "value: proxy" "X-Forwarded-Email" "--pass-user-headers=true" '"--scope=openid email"'; do
            if ! grep -qF -- "$expected" <<<"$rendered"; then
              echo "::error::auth.enabled renders without $expected"
              exit 1
            fi
          done
          if grep -qF -- "value: proxy" <<<"$(helm template t deploy/helm/kanban)"; then
            echo "::error::AUTH_MODE=proxy is set without the sidecar that supplies the header"
            exit 1
          fi
          # The consent screen the operator has to sign off on is these scopes,
          # so what the chart asks for is asserted rather than inherited from
          # whatever oauth2-proxy defaults to this release.
          github="$(helm template t deploy/helm/kanban "${auth[@]}" --set auth.provider=github)"
          if ! grep -qF -- '"--scope=user:email read:org"' <<<"$github"; then
            echo "::error::the github sign-in no longer asks for the scopes it needs to complete"
            exit 1
          fi
          ok "${auth[@]}" --set 'auth.scopes={openid,email}'
          # Narrowing GitHub renders a sign-in that cannot finish, so the chart
          # refuses it; see the comment on auth.scopes in values.yaml.
          nope "${auth[@]}" --set auth.provider=github --set 'auth.scopes={user:email}'
          # Snapshots. A target is what turns the schedule on, and the pod's root
          # filesystem is read-only, so most of what follows is about whether the
          # directory the app is told to write to exists in the pod at all.
          bucket=(--set backup.s3.bucket=snapshots --set backup.s3.region=eu-central-2
                  --set backup.s3.existingSecret=kanban-backup)
          ok --set backup.dir.enabled=true
          ok --set backup.dir.enabled=true --set backup.dir.persistence.existingClaim=snapshots
          ok --set storage=sqlite --set postgres.enabled=false \
             --set backup.dir.enabled=true --set backup.dir.persistence.enabled=false \
             --set backup.dir.path=/data/snapshots
          ok --set backup.dir.enabled=true --set backup.interval=0
          ok --set backup.dir.enabled=true --set backup.interval=1h30m
          ok "${bucket[@]}"
          ok --set backup.s3.bucket=snapshots --set backup.s3.region=eu-central-2 \
             --set backup.s3.accessKeyID=key --set backup.s3.secretAccessKey=secret \
             --set backup.s3.prefix=pi/ --set backup.s3.endpoint=https://minio.example.com:9000
          # A release installed before the backup section existed, as with auth.
          ok --set backup=null
          # Whichever target is configured has to reach the app as BACKUP_*, or
          # the chart has described a schedule that never runs.
          snapshots="$(helm template t deploy/helm/kanban "${bucket[@]}")"
          for expected in "name: BACKUP_S3_BUCKET" "name: BACKUP_S3_REGION" "name: BACKUP_INTERVAL" \
                          "name: kanban-backup, key: access-key-id"; do
            if ! grep -qF -- "$expected" <<<"$snapshots"; then
              echo "::error::backup.s3 renders without $expected"
              exit 1
            fi
          done
          if grep -qF -- "name: BACKUP_" <<<"$(helm template t deploy/helm/kanban)"; then
            echo "::error::the schedule is configured with no target to write to"
            exit 1
          fi
          nope --set backup.dir.enabled=true "${bucket[@]}"
          nope --set backup.dir.enabled=true --set backup.interval=24
          # The app refuses a schedule under a minute, and no template can tell
          # 90s from 90m, so the chart takes minutes and hours and nothing else.
          nope --set backup.dir.enabled=true --set backup.interval=30s
          nope --set backup.dir.enabled=true --set backup.interval=500ms
          nope --set backup.dir.enabled=true --set backup.keep=-1
          nope --set backup.dir.enabled=true --set backup.dir.path=snapshots
          nope --set backup.dir.enabled=true --set backup.dir.path=/tmp/snapshots
          # Nothing is mounted, so the app would write into the read-only root.
          nope --set backup.dir.enabled=true --set backup.dir.persistence.enabled=false
          nope --set storage=sqlite --set postgres.enabled=false \
               --set backup.dir.enabled=true --set backup.dir.persistence.enabled=false
          # One claim, ReadWriteOnce, two pods that both want it.
          nope --set replicaCount=2 --set backup.dir.enabled=true
          nope --set backup.s3.bucket=snapshots --set backup.s3.existingSecret=kanban-backup
          nope --set backup.s3.bucket=snapshots --set backup.s3.region=eu-central-2
          nope "${bucket[@]}" --set backup.s3.prefix=/pi
          nope "${bucket[@]}" --set backup.s3.endpoint=minio.example.com:9000
          # The policy allows DNS and the bundled Postgres, and a bucket is
          # neither, so the peer has to be named instead of assumed.
          nope "${bucket[@]}" --set networkPolicy.enabled=true
          ok "${bucket[@]}" --set networkPolicy.enabled=true \
             --set 'networkPolicy.allowTo[0].to[0].ipBlock.cidr=0.0.0.0/0' \
             --set 'networkPolicy.allowTo[0].ports[0].port=443'
          nope --set storage=sqlite
          nope --set storage=memory
          nope --set storage=postgres --set postgres.enabled=false
          nope --set ingress.enabled=true --set ingress.hosts=null
          nope --set postgres.password='has a space'
          nope --set auth.enabled=true
          nope --set auth.tls.enabled=true
          echo "all combinations behave"

  deploy:
    name: compose and unraid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: every compose profile is valid, with nothing set and as .env.example ships
        run: |
          set -euo pipefail
          for profile in sqlite postgres demo; do
            # Compose interpolates the whole file whichever profile is asked
            # for, so a variable one service needs must not break the others.
            if ! docker compose -f deploy/compose/compose.yaml --profile "$profile" config -q; then
              echo "::error::the $profile profile does not validate with an empty environment"
              exit 1
            fi
            if ! docker compose --env-file deploy/compose/.env.example \
                 -f deploy/compose/compose.yaml --profile "$profile" config -q; then
              echo "::error::the $profile profile does not validate with .env.example"
              exit 1
            fi
          done
          echo "sqlite, postgres and demo all validate"
      - name: the unraid template is one unraid would accept
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("deploy/unraid/kanban.xml").getroot()
          bad = []
          if root.tag != "Container":
              bad.append(f"the root element is {root.tag}, not Container")
          # Unraid reads these to build the form and the WebUI link. A template
          # missing one of them installs and then behaves oddly, which is worse
          # than not installing.
          for tag in ("Name", "Repository", "Registry", "Support", "Overview",
                      "Category", "WebUI", "Network", "ExtraParams"):
              if root.findtext(tag, "").strip() == "":
                  bad.append(f"<{tag}> is missing or empty")
          if "[PORT:17808]" not in root.findtext("WebUI", ""):
              bad.append("the WebUI link does not follow the port the form sets")
          # The image runs as uid 65532 and /mnt/user/appdata belongs to
          # nobody:users, so without this the container cannot write its database.
          if "--user 99:100" not in root.findtext("ExtraParams", ""):
              bad.append("ExtraParams no longer runs the container as nobody:users")
          for i, config in enumerate(root.findall("Config")):
              name = config.get("Name") or f"#{i + 1}"
              for attr in ("Name", "Target", "Type", "Display", "Required", "Mask"):
                  if not config.get(attr):
                      bad.append(f"Config {name} has no {attr}")
              if config.get("Type") not in ("Variable", "Path", "Port", "Device", "Label"):
                  bad.append(f"Config {name} has Type {config.get('Type')}")
          if bad:
              for line in bad:
                  print(f"::error::deploy/unraid/kanban.xml: {line}")
              sys.exit(1)
          print(f"the template parses, with {len(root.findall('Config'))} settings on the form")
          PY
      - name: one release version in every file that names one
        run: |
          set -euo pipefail
          want="$(awk -F'"' '/^appVersion:/ {print $2}' deploy/helm/kanban/Chart.yaml)"
          if [ -z "$want" ]; then
            echo "::error::no appVersion in deploy/helm/kanban/Chart.yaml"
            exit 1
          fi
          pattern='(golang-kanban:|KANBAN_TAG[=:-]+)[0-9]+\.[0-9]+\.[0-9]+'
          found="$( { grep -rhoE "$pattern" deploy; grep -hoE "$pattern" readme.md; } \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)"
          if [ "$found" != "$want" ]; then
            echo "::error::Chart.yaml says $want; deploy/ and the readme name $(echo "$found" | tr '\n' ' ')"
            echo "::error::a release bumps the chart, the compose file, .env.example, the unraid template and the readme together"
            exit 1
          fi
          echo "everything ships $want"
