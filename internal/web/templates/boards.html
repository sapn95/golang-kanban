{{define "content"}}
<div class="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none p-6">
  {{if .Boards}}
  <h2 class="text-xl font-bold mb-4">Boards</h2>
  <ul class="space-y-2 mb-6">
    {{range .Boards}}
    <li><a class="block px-4 py-3 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600" href="/b/{{.Slug}}">
      <span class="font-semibold">{{.Name}}</span>
      <span class="text-sm text-slate-500 dark:text-slate-400 ml-2">{{len .Columns}} columns</span>
    </a></li>
    {{end}}
  </ul>
  {{else}}
  <p class="mb-6 text-slate-600 dark:text-slate-300">No boards yet. Create the first one.</p>
  {{end}}
  <form method="post" action="/boards" class="flex gap-2">
    <input type="text" name="name" placeholder="New board name" required maxlength="100"
      class="flex-1 px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-950 text-slate-900 dark:text-white">
    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Create</button>
  </form>
  {{with .Error}}<p class="mt-3 text-red-600 dark:text-red-400" role="alert">{{.}}</p>{{end}}
</div>
{{end}}
