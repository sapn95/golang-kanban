{{define "content"}}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
  {{if .Boards}}
  <h2 class="text-xl font-bold mb-4">Boards</h2>
  <ul class="space-y-2 mb-6">
    {{range .Boards}}
    <li><a class="block px-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-blue-50 dark:hover:bg-gray-600" href="/b/{{.Slug}}">
      <span class="font-semibold">{{.Name}}</span>
      <span class="text-sm text-gray-500 dark:text-gray-400 ml-2">{{len .Columns}} columns</span>
    </a></li>
    {{end}}
  </ul>
  {{else}}
  <p class="mb-6 text-gray-600 dark:text-gray-300">No boards yet. Create the first one.</p>
  {{end}}
  <form method="post" action="/boards" class="flex gap-2">
    <input type="text" name="name" placeholder="New board name" required maxlength="100"
      class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Create</button>
  </form>
  {{with .Error}}<p class="mt-3 text-red-600 dark:text-red-400" role="alert">{{.}}</p>{{end}}
</div>
{{end}}
