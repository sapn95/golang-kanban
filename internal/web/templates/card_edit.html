{{define "card_fields"}}
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title</label>
  <input type="text" name="title" value="{{.Card.Title}}" placeholder="Card title" required maxlength="200"
    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
</div>
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
  <textarea name="description" rows="3" placeholder="Description"
    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white">{{.Card.Description}}</textarea>
</div>
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Due date</label>
  <input type="date" name="due_date" value="{{.DueInput}}"
    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
</div>
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Assignee</label>
  <div class="flex items-center gap-2">
    <input type="email" name="assignee" value="{{.Card.Assignee}}" placeholder="nobody" maxlength="320"
      class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
    {{if .Viewer.Email}}
    <button type="button" title="Assign to me"
      class="px-3 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-100"
      onclick="this.closest('div').querySelector('input[name=assignee]').value = '{{.Viewer.Email}}'">Me</button>
    {{end}}
  </div>
</div>
{{if .BoardLabels}}
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Labels</label>
  <div class="flex flex-wrap gap-3">
    {{$card := .Card}}
    {{range .BoardLabels}}
    <label class="inline-flex items-center gap-1 text-sm">
      <input type="checkbox" name="labels" value="{{.ID}}"{{if hasLabel $card .ID}} checked{{end}} class="w-4 h-4 rounded"> {{.Name}}
    </label>
    {{end}}
  </div>
</div>
{{end}}
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subtasks</label>
  <div class="subtasks-container space-y-2">
    {{range .Card.Subtasks}}
    <div class="subtask-row flex items-center space-x-2 mb-2">
      <input type="checkbox" class="subtask-complete w-4 h-4 text-blue-600 rounded focus:ring-blue-500"{{if .Done}} checked{{end}}>
      <input type="text" value="{{.Title}}" class="subtask-text flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm">
      <button type="button" class="remove-subtask-btn text-red-500 hover:text-red-700 p-1" title="Remove"><i class="bi bi-x text-lg"></i></button>
    </div>
    {{end}}
  </div>
  <button type="button" class="mt-2 bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm add-subtask-btn">
    <i class="bi bi-plus mr-1"></i>Add Subtask
  </button>
  <input type="hidden" name="subtasks" class="subtasks-hidden">
</div>
{{end}}

{{define "card_edit"}}
<div class="p-6 border-b border-gray-200 dark:border-gray-600">
  <div class="flex justify-between items-center">
    <h5 class="text-xl font-bold text-gray-900 dark:text-white">Edit Card</h5>
    <button type="button" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" onclick="hideModal('editCardModal')">
      <i class="bi bi-x text-2xl"></i>
    </button>
  </div>
</div>
<div class="p-6">
  <form hx-post="/cards/{{.Card.ID}}" hx-target="#card-{{.Card.ID}}" hx-swap="outerHTML" onsubmit="return prepareSubtasks(this)">
    {{template "card_fields" .}}
    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-600">
      <button type="button" class="px-4 py-2 text-gray-700 dark:text-gray-300 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 rounded-lg" onclick="hideModal('editCardModal')">Cancel</button>
      <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Save</button>
    </div>
  </form>
</div>
{{end}}
