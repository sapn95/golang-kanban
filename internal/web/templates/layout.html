{{define "layout"}}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" href="{{asset "logo.svg"}}" type="image/svg+xml">
  <!-- Before anything paints. app.js is deferred, so leaving the theme to it
       meant every navigation flashed white before the dark class landed. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* private mode */ }
    })();
  </script>
  <!-- Tailwind first, app.css second: both are ordinary stylesheets now, so a
       rule of ours wins a tie against Tailwind's reset. -->
  <link rel="stylesheet" href="{{asset "tailwind.css"}}">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <link rel="stylesheet" href="{{asset "vendor/bootstrap-icons/bootstrap-icons.min.css"}}">
  <script src="{{asset "vendor/htmx/htmx.min.js"}}"></script>
  <script src="{{asset "vendor/sortablejs/Sortable.min.js"}}"></script>
  <script src="{{asset "app.js"}}" defer></script>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200"{{with .BoardSlug}} data-board="{{.}}"{{end}}>
<div class="container mx-auto py-4 px-3 sm:py-8 sm:px-4">
  <div class="flex justify-between items-center gap-2 mb-4 sm:mb-8">
    <img src="{{asset "logo.svg"}}" alt="" width="40" height="40" class="w-8 h-8 sm:w-10 sm:h-10 shrink-0">
    <h1 class="text-2xl sm:text-4xl font-bold text-center flex-1 truncate bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
      {{.Title}}
    </h1>
    {{if .User.Email}}
    <span class="hidden sm:flex items-center gap-2 mr-3 text-sm text-gray-600 dark:text-gray-300"
          title="{{.User.Email}}">
      <span class="relative inline-flex items-center justify-center w-7 h-7 shrink-0 overflow-hidden rounded-full
                   bg-gradient-to-br from-blue-600 to-purple-600 text-white text-xs font-semibold uppercase">
        {{.User.Initials}}
        <!-- Same as on a card: the picture covers the initials rather than
             replacing them, so they stay as the fallback. -->
        {{with avatar .User.Email}}
        <img src="{{.}}" alt="" loading="lazy" class="absolute inset-0 h-full w-full object-cover">
        {{end}}
      </span>
      {{.User.Display}}
    </span>
    {{end}}
    <button id="darkModeToggle" type="button"
      class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200"
      title="Toggle dark mode">
      <i class="bi bi-sun text-xl dark:hidden"></i>
      <i class="bi bi-moon text-xl hidden dark:inline"></i>
    </button>
  </div>
  {{template "content" .}}
</div>
</body>
</html>{{end}}
