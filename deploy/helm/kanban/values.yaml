# Storage backend: postgres, sqlite or memory.
#
# sqlite keeps the board in one file on a volume this chart claims. No database
# server, and one writer: replicaCount has to stay 1.
#
# memory keeps everything in the pod and loses it on restart. It needs no
# database and is the fastest way to look at the app; use it for a demo, never
# for anything you want to keep.
storage: postgres

image:
  # The package this repository publishes. Upstream's own package,
  # ghcr.io/nicolashaas/golang-kanban, stops at 1.0.1 and predates everything
  # this chart configures.
  repository: ghcr.io/sapn95/golang-kanban
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# The app holds no state of its own, but two replicas against one Postgres are
# only safe once the store is proven under concurrency. Keep this at 1 unless
# you have tested otherwise. With storage=memory or storage=sqlite the chart
# refuses anything but 1.

service:
  type: ClusterIP
  port: 17808
  # nodePort: 30808   # honoured when type is NodePort

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kanban.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Bundled Postgres. Convenience for a test cluster, not a production database:
# one replica, no backups, no failover. Point externalDatabase at a real server
# for anything that matters.
postgres:
  enabled: true
  image: postgres:16-alpine
  user: kanban
  database: kanban
  # password: ""     # generated and stored in a Secret when left empty

  # Name a Secret that already holds keys "password" and "url", and the chart
  # will not create one. This is the answer for GitOps: `helm template` has no
  # cluster to read the previous password back from, so without it the rendered
  # Secret carries a freshly generated password on every sync while the
  # database keeps the one it was initialised with. The mismatch stays hidden
  # until the pod restarts.
  existingSecret: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# Without a policy every pod in the cluster can reach this one on the app port,
# so an oauth2-proxy sidecar or a tunnel in front only constrains what comes
# through them, not what comes from the pod next door. Off by default because a
# cluster whose CNI ignores policies would silently look protected; k3s enforces
# them.
networkPolicy:
  enabled: false
  # The kubelet probes from the node, which has no pod label to select, so its
  # address has to be named. This must be the node's own address on the pod
  # network, not the pod CIDR: the whole CIDR is every pod in the cluster, which
  # would make the ingress rule allow exactly what the policy exists to stop.
  # On k3s the node is the .1 of its pod range; check with
  #   kubectl get node -o jsonpath='{.items[*].spec.podCIDR}'
  probeSources:
    - 10.42.0.1/32
  # Extra ingress peers, in NetworkPolicyPeer form. This is where the tunnel
  # connector or an ingress controller goes:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflared}}
  allowFrom: []
  # Extra egress, same form. DNS and the bundled Postgres are already allowed.
  allowTo: []

# Used when storage is sqlite. The chart creates the claim, mounts it at the
# directory holding the file, and keeps it when the release is uninstalled.
sqlite:
  # The database file. The mount is its directory, not the file itself: SQLite
  # puts the -wal and -shm files next to it and needs to create them.
  path: /data/kanban.db
  persistence:
    size: 1Gi
    storageClass: ""

# Used when postgres.enabled is false. existingSecret wins over url.
externalDatabase:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# Sign-in in front of the board, and TLS with it.
#
# oauth2-proxy runs as a sidecar. With auth.enabled the Service stops pointing at
# the app and points at the proxy instead, so the board is only reachable through
# a session the proxy issued; the app itself is then bound to the pod only.
#
# Everyone who gets in shares the same boards. What the sign-in decides is who
# gets in, and who the board then says did the work.
auth:
  enabled: false

  # entra | github | oidc
  provider: entra

  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4

  # The header oauth2-proxy puts the signed-in address in, which the app reads
  # so that an assignee and a comment have a name on them (AUTH_MODE=proxy,
  # AUTH_HEADER=this). Empty leaves the app anonymous behind the sign-in.
  #
  # A header is a claim by whatever wrote it, so this is only sound while the
  # app's own port cannot be reached except through the proxy. With
  # auth.enabled no Service points at the app, and networkPolicy.enabled shuts
  # the pod's port to everything but the ingress; see docs/adr/0005.
  identityHeader: X-Forwarded-Email

  # Where the provider sends the browser back. oauth2-proxy serves the callback
  # at <proxyPrefix>/callback, so this is your external URL plus /oauth2/callback.
  # Required: the provider rejects a mismatch, and there is no sane default.
  redirectURL: ""

  # Supply these directly, or name a Secret that already holds them under the
  # keys client-id, client-secret and (optionally) cookie-secret.
  clientID: ""
  clientSecret: ""
  existingSecret: ""

  # Who may sign in. "*" means anyone the provider authenticates, which for a
  # public GitHub app is everyone with a GitHub account — narrow it.
  emailDomains: ["*"]

  # What the sign-in asks the provider for. This is the list of permissions the
  # consent screen shows the person signing in, so it is worth setting on
  # purpose rather than inheriting.
  #
  # Empty asks for the smallest set that works with the provider below:
  #
  #   entra, oidc   openid email
  #   github        user:email read:org
  #
  # The address is the only thing the proxy passes on (identityHeader above), so
  # for entra and oidc the address is all the chart asks for. oauth2-proxy would
  # have asked for "profile" as well, which is a display name and a picture.
  # Add it back here if you would rather have the name the provider holds than
  # the one the app reads out of the address.
  #
  # GitHub is the exception, and it is why this is documented at all. Its
  # consent screen offers "read your organization, team membership, and private
  # project boards", which is read:org, and oauth2-proxy needs it even with no
  # organisation configured: it calls /user/orgs and /user/teams on every
  # sign-in and GitHub answers 403 to a token that lacks the scope, which fails
  # the sign-in rather than the membership check. So the chart cannot narrow
  # GitHub, and it refuses a scope list for github that leaves read:org out
  # instead of rendering a sign-in that cannot complete. Where granting that is
  # not acceptable, entra or a generic oidc provider asks for the address only,
  # and Cloudflare Access in front of the board does the same job without this
  # sidecar.
  scopes: []

  entra:
    # A directory (tenant) id, or "common" for any Microsoft account,
    # "organizations" for any work or school account.
    tenant: common

  github:
    org: ""        # restrict to members of this organisation
    team: ""       # ... and this team within it
    repo: ""       # ... or collaborators on this repository
    users: []      # always allow these logins regardless of the above

  oidc:
    issuerURL: ""  # for provider: oidc

  cookie:
    # Generated and kept in the Secret when empty, exactly like the database
    # password. Must be 16, 24 or 32 bytes if you set it yourself.
    secret: ""
    # Browsers drop a Secure cookie sent over plain HTTP, so a sign-in loop that
    # never completes is usually this set to true without TLS in front.
    secure: true

  # oauth2-proxy terminates TLS itself. This is the whole reason it can replace a
  # separate reverse proxy: one component does the sign-in and the certificate.
  tls:
    enabled: false
    # A kubernetes.io/tls Secret. Create it however you like:
    #   kubectl create secret tls kanban-tls --cert=cert.pem --key=key.pem
    existingSecret: ""
    minVersion: TLS1.2

  extraArgs: []

  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}

app:
  logLevel: info      # debug | info | warn | error
  logFormat: json     # text | json
  autoMigrate: true
  extraEnv: []

resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {memory: 128Mi}

# The image is gcr.io/distroless/static-debian12:nonroot, which runs as uid
# 65532 and carries no shell and no package manager.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
