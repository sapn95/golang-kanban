{{- include "kanban.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kanban.fullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.storage "sqlite" }}
  # A rolling update would start the new pod before the old one lets go of the
  # file, so the two would either fight over the database or the second would
  # sit unschedulable on a ReadWriteOnce volume. Old pod first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "kanban.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kanban.selectorLabels" . | nindent 8 }}
      {{- /* No checksum/db-secret annotation. Re-rendering secret.yaml here
             evaluates the password helper a second time, so on a generated
             password the hash described a Secret that was never installed and
             the first upgrade always rolled the pod for nothing. The Secret is
             stable by design now, so there is nothing for a checksum to catch. */}}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and (eq .Values.storage "postgres") .Values.postgres.enabled }}
      # The app exits when the database is unreachable at startup rather than
      # retrying, so without this the first install spends a minute in
      # CrashLoopBackOff waiting for Postgres to finish initialising.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "kanban.postgresFullname" . }} -p 5432 -U {{ .Values.postgres.user | quote }} -d {{ .Values.postgres.database | quote }}; do
                echo "waiting for postgres"; sleep 2
              done
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      {{- end }}
      containers:
        - name: kanban
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: STORAGE
              value: {{ .Values.storage | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.app.logFormat | quote }}
            - name: AUTO_MIGRATE
              value: {{ .Values.app.autoMigrate | quote }}
            {{- if eq .Values.storage "postgres" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.enabled }}
                  name: {{ include "kanban.postgresSecretName" . }}
                  key: url
                  {{- else if .Values.externalDatabase.existingSecret }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
                  {{- else }}
                  name: {{ include "kanban.fullname" . }}-db
                  key: url
                  {{- end }}
            {{- end }}
            {{- if eq .Values.storage "sqlite" }}
            - name: SQLITE_PATH
              value: {{ .Values.sqlite.path | quote }}
            {{- end }}
            {{- $auth := .Values.auth | default dict }}
            {{- if and $auth.enabled $auth.identityHeader }}
            # The sidecar has already established who the caller is, so the app
            # reads it off the request instead of serving an anonymous board
            # behind a sign-in.
            - name: AUTH_MODE
              value: proxy
            - name: AUTH_HEADER
              value: {{ $auth.identityHeader | quote }}
            {{- end }}
            {{- $backup := .Values.backup | default dict }}
            {{- $bdir := $backup.dir | default dict }}
            {{- $bs3 := $backup.s3 | default dict }}
            {{- if or $bdir.enabled $bs3.bucket }}
            {{- /* A target is what turns the schedule on, so the interval and the
                   retention are only written down when there is one. */}}
            - name: BACKUP_INTERVAL
              value: {{ $backup.interval | quote }}
            - name: BACKUP_KEEP
              value: {{ $backup.keep | default 0 | quote }}
            {{- if $bdir.enabled }}
            - name: BACKUP_DIR
              value: {{ $bdir.path | quote }}
            {{- else }}
            {{- $bsec := include "kanban.backupSecretName" . }}
            - name: BACKUP_S3_BUCKET
              value: {{ $bs3.bucket | quote }}
            {{- with $bs3.prefix }}
            - name: BACKUP_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: BACKUP_S3_REGION
              value: {{ $bs3.region | quote }}
            {{- with $bs3.endpoint }}
            - name: BACKUP_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- /* The app signs its own requests, so these are the whole
                   credential chain. AWS_SESSION_TOKEN is deliberately not here:
                   nothing in this chart refreshes one, so it belongs in
                   app.extraEnv beside whatever does. */}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ $bsec }}, key: access-key-id}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $bsec }}, key: secret-access-key}}
            {{- end }}
            {{- end }}
            {{- with .Values.app.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          # /healthz answers as soon as the process is up; /readyz additionally
          # checks the store, so it is the one that gates traffic.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem is on and the binary is static, but Go still
          # wants somewhere to put temporary files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.storage "sqlite" }}
            # The only writable path that survives the pod. fsGroup 65532 in
            # podSecurityContext is what lets the non-root user write to it.
            - name: data
              mountPath: {{ include "kanban.sqliteDir" . | quote }}
            {{- end }}
            {{- if include "kanban.backupMountsAVolume" . }}
            # Its own volume, so a snapshot outlives the volume it is a copy of.
            - name: backups
              mountPath: {{ .Values.backup.dir.path | quote }}
            {{- end }}
        {{- if (.Values.auth | default dict).enabled }}
        {{- $sec := .Values.auth.existingSecret | default (include "kanban.authFullname" .) }}
        - name: oauth2-proxy
          image: {{ .Values.auth.image | quote }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --provider={{ ternary "entra-id" .Values.auth.provider (eq .Values.auth.provider "entra") }}
            {{- if eq .Values.auth.provider "entra" }}
            - --azure-tenant={{ .Values.auth.entra.tenant }}
            - --oidc-issuer-url=https://login.microsoftonline.com/{{ .Values.auth.entra.tenant }}/v2.0
            {{- else if eq .Values.auth.provider "oidc" }}
            - --oidc-issuer-url={{ .Values.auth.oidc.issuerURL }}
            {{- else if eq .Values.auth.provider "github" }}
            {{- with .Values.auth.github.org }}- --github-org={{ . }}{{ end }}
            {{- with .Values.auth.github.team }}
            - --github-team={{ . }}
            {{- end }}
            {{- with .Values.auth.github.repo }}
            - --github-repo={{ . }}
            {{- end }}
            {{- range .Values.auth.github.users }}
            - --github-user={{ . }}
            {{- end }}
            {{- end }}
            {{- /* One argument, spaces and all: --scope takes the whole list as
                   a single space-separated string. */}}
            - {{ printf "--scope=%s" (include "kanban.authScopes" .) | quote }}
            {{- range .Values.auth.emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            - --redirect-url={{ .Values.auth.redirectURL }}
            {{- /* The app is the only upstream and it never leaves the pod. */}}
            - --upstream=http://127.0.0.1:{{ .Values.service.port }}
            {{- if .Values.auth.tls.enabled }}
            - --https-address=0.0.0.0:4443
            - --tls-cert-file=/tls/tls.crt
            - --tls-key-file=/tls/tls.key
            - --tls-min-version={{ .Values.auth.tls.minVersion }}
            {{- else }}
            {{- /* The default is 127.0.0.1:4180, which no other pod could reach. */}}
            - --http-address=0.0.0.0:4180
            {{- end }}
            - --cookie-secure={{ .Values.auth.cookie.secure }}
            {{- if .Values.auth.identityHeader }}
            {{- /* Puts X-Forwarded-User and X-Forwarded-Email on the upstream
                   request. It is the default, and the app now depends on it,
                   so it is written down. */}}
            - --pass-user-headers=true
            {{- end }}
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
            {{- with .Values.auth.extraArgs }}{{- toYaml . | nindent 12 }}{{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: client-id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: cookie-secret}}
          ports:
            {{- if .Values.auth.tls.enabled }}
            - name: https
              containerPort: 4443
            {{- else }}
            - name: auth
              containerPort: 4180
            {{- end }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ ternary "https" "auth" .Values.auth.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.auth.tls.enabled }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ ternary "https" "auth" .Values.auth.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.auth.tls.enabled }}
            periodSeconds: 5
          resources: {{- toYaml .Values.auth.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.auth.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.storage "sqlite" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kanban.sqliteFullname" . }}
        {{- end }}
        {{- if include "kanban.backupMountsAVolume" . }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.dir.persistence.existingClaim | default (include "kanban.backupFullname" .) }}
        {{- end }}
        {{- if and (.Values.auth | default dict).enabled ((.Values.auth | default dict).tls | default dict).enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.auth.tls.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
