{{- include "kanban.validate" . -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kanban.authFullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
  annotations:
    {{- /* Kept for the same reason as the database Secret: losing the cookie
           secret signs every open session out, and losing the client secret
           means going back to the provider for a new one. */}}
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  client-id: {{ .Values.auth.clientID | quote }}
  client-secret: {{ .Values.auth.clientSecret | quote }}
  cookie-secret: {{ include "kanban.cookieSecret" . | quote }}
{{- end }}
