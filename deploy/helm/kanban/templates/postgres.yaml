{{- if and (eq .Values.storage "postgres") .Values.postgres.enabled }}
{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kanban.postgresFullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kanban.postgresFullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector: {{- include "kanban.postgresSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kanban.postgresFullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One database, one volume: never run two of these against the same PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "kanban.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kanban.postgresSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kanban.postgresFullname" . }}
                  key: password
            # The image refuses to initialise into a non-empty mount point, and
            # a PVC arrives with lost+found on many storage classes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            # -h 127.0.0.1 forces the TCP path. Without it pg_isready checks the unix
            # socket, which is ready before the port every client actually uses is.
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]}
            periodSeconds: 5
          livenessProbe:
            # -h 127.0.0.1 forces the TCP path. Without it pg_isready checks the unix
            # socket, which is ready before the port every client actually uses is.
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kanban.postgresFullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
