{{- if .Values.networkPolicy.enabled }}
{{- /* Without a policy every pod in the cluster can reach this one on the app
       port, so "only reachable through the proxy" is true of the proxy's view
       and of nothing else. k3s enforces policies when they exist. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kanban.fullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kanban.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- /* The kubelet probes from the node, which has no pod label to
               select, so the node's own addresses are named instead. */}}
        {{- range .Values.networkPolicy.probeSources }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- with .Values.networkPolicy.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- /* The same value the Deployment passes as SERVER_PORT, so the
               policy cannot allow a port the app is not listening on. The
               previous service.targetPort does not exist in values.yaml, so
               this always fell back to a literal that happened to match. */}}
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    {{- /* DNS, or nothing resolves. */}}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if and (eq .Values.storage "postgres") .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels: {{- include "kanban.postgresSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- with .Values.networkPolicy.allowTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
