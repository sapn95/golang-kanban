{{- include "kanban.validate" . -}}
{{- if and (eq .Values.storage "postgres") .Values.postgres.enabled }}
{{- /* Evaluate once: two calls would run randAlphaNum twice and hand Postgres
       one password while the DSN in the same Secret carried another. */ -}}
{{- $password := include "kanban.postgresPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kanban.postgresFullname" . }}
  labels: {{- include "kanban.labels" . | nindent 4 }}
  annotations:
    {{- /* Same lifetime as the PVC. Keeping the volume while deleting the only
           copy of its password leaves data that nothing can open. */}}
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{- /* No encoding here: kanban.validateDSNParts has already refused every
         character that would need it. */}}
  url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user $password (include "kanban.postgresFullname" .) .Values.postgres.database | quote }}
{{- end }}
{{- if and (eq .Values.storage "postgres") (not .Values.postgres.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- /* The Deployment reads DATABASE_URL from a Secret in this case too. Without
       this object the pod sits in CreateContainerConfigError while helm reports
       the release deployed. */}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kanban.fullname" . }}-db
  labels: {{- include "kanban.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "storage=postgres with postgres.enabled=false needs externalDatabase.url or externalDatabase.existingSecret" .Values.externalDatabase.url | quote }}
{{- end }}
